<title>250 Grammi - Front of House Academy</title>
<style>
:root{--bg:#17352a;--paper:#fff;--ink:#1c1c1a;--mu:#6b6a62;--red:#b8322a;--grn:#2c7a4b;--ln:#d9d2bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#f4f2ec;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{min-height:100vh}#app.narrow{max-width:620px;margin:0 auto;padding:22px 16px 48px}
.t,h1,h2,h3{font-family:"American Typewriter","Courier New",ui-monospace,monospace}
.flag{height:5px;border-radius:3px;margin-bottom:18px;background:linear-gradient(90deg,#2c7a4b 33%,#f6f2e7 33% 66%,#b8322a 66%)}
h1{font-size:clamp(34px,10vw,52px);line-height:1;margin:0 0 6px;letter-spacing:.04em}
h2{font-size:22px;margin:26px 0 6px}
.sub{color:var(--mu);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ln);border-radius:99px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--bg);color:#fff;border-color:var(--bg);font-weight:700}
.chip small{opacity:.7}
.go,.ghost{display:block;width:100%;font:700 18px "American Typewriter","Courier New",monospace;padding:16px;border-radius:14px;border:0;cursor:pointer;margin-top:12px}
.go{background:var(--red);color:var(--paper)}
.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ln)}
.go:active,.opt:active{transform:scale(.98)}
.soon{margin-top:26px;color:var(--mu);font-size:14px}
.top{display:flex;align-items:center;gap:12px}
.x{font:inherit;font-size:20px;color:var(--ink);background:none;border:0;cursor:pointer;padding:6px}
.bar{flex:1;height:8px;border-radius:4px;background:#0000001a;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bg);transition:width .3s}
.meta{margin:12px 0;color:var(--mu);font-size:15px;min-height:24px}
.q{background:var(--paper);color:var(--ink);border-radius:14px;padding:22px 20px;margin:0 0 16px;font-size:21px;line-height:1.3;animation:in .25s}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:58px;padding:12px 14px;margin:0 0 10px;background:#fff;color:var(--ink);border:2px solid var(--ln);border-radius:14px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt span{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ln);display:grid;place-items:center;font:700 14px "Courier New",monospace}
.opt:not(:disabled):hover{border-color:#f2c14e}
.opt:disabled{cursor:default;color:var(--ink);opacity:.5}
.opt.ok{opacity:1;border-color:var(--grn);background:#dcefe0}
.opt.ok span{background:var(--grn);color:#fff}
.opt.bad{opacity:1;border-color:var(--red);background:#f6dcd8;animation:sk .3s}
.opt.bad span{background:var(--red);color:#fff}
.fb{border-radius:14px;padding:14px 16px;margin-top:6px;background:var(--paper);color:var(--ink);border-left:8px solid var(--grn);animation:in .25s}
.fb.bad{border-color:var(--red)}
.fb b{font:700 19px "American Typewriter","Courier New",monospace}
.fb p{margin:6px 0 0;color:#3c3b36}
.res{text-align:center}
.big{font-size:64px;margin-top:16px}
.rv{text-align:left;background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;margin:10px 0}
.rv span{display:block;color:var(--grn);font-weight:700;margin:4px 0}
.rv small{color:var(--mu)}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:8px 0 20px}
.pc{display:block;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:0;border-left:10px solid var(--red);border-radius:16px;padding:20px;font:inherit;cursor:pointer;transition:transform .15s}
.pc[data-p=bar]{border-color:#c9a227}.pc[data-p=kitchen]{border-color:var(--grn)}

textarea,select{width:100%;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:0 0 8px}
textarea{min-height:52vh;resize:vertical}
.bar2{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-bottom:10px}
.lnk{background:none;border:0;color:#9fb3a5;font:inherit;font-size:13px;cursor:pointer;padding:6px 4px;text-decoration:underline}
.sm{font:inherit;font-size:14px;color:var(--paper);background:none;border:1.5px solid #f6f2e766;border-radius:99px;padding:6px 16px;cursor:pointer}
.ct{text-align:center}
.lg{max-width:360px;margin:24px auto}
.lg label{display:block;margin:0 0 14px;color:var(--mu);font-size:14px}
.lg input{display:block;width:100%;margin-top:4px;padding:14px;font:16px system-ui,sans-serif;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
.err{color:var(--red);min-height:24px;margin:0}
.sc{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px;margin:0 0 14px}

.who{padding:6px 12px 10px}.who b{display:block;color:#fff}.who small{color:#9fb3a5}

#cvw{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}

.uc{margin-left:auto;font-size:14px;color:var(--mu);background:#f0ede4;border-radius:99px;padding:4px 12px}
#cv{padding:24px;max-width:920px;width:100%;margin:0 auto}
#sbk{display:none}

@media(max-width:800px){#sb{position:fixed;z-index:20;left:0;transform:translateX(-100%);transition:transform .2s;width:250px!important}#shell.open #sb{transform:none}#shell.open #sbk{display:block;position:fixed;inset:0;background:#0006;border:0;z-index:10}#cv{padding:16px}#top{padding:10px 16px}.lgp{grid-template-columns:1fr}.lgl{padding:32px 24px}}
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 6px}
.tb input,.tb select{width:auto;flex:1;min-width:180px;margin:0}.tb select{flex:0 0 180px;min-width:150px}
.sm2{width:auto;display:inline-block;margin:0;padding:10px 16px;font-size:15px}.go.ok{background:var(--grn)}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--ln);border-radius:12px}
.dt{width:100%;border-collapse:collapse;min-width:760px}

.dt td{padding:6px;vertical-align:top;border-bottom:1px solid #eee9da}
.dt input,.dt select,.dt textarea{width:100%;margin:0;padding:8px;font:14px system-ui,sans-serif;border:1px solid var(--ln);border-radius:8px;background:#fff;min-height:0}
.dt textarea{resize:vertical}
.dt td:nth-child(1){width:24%}.dt td:nth-child(2){width:17%}.dt td:nth-child(3){width:9%}.dt td:last-child{width:92px;white-space:nowrap}
.dt tr.bad td{background:#fdecea}
.mu{color:var(--mu);font-size:14px}
button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function cdone(){
 const sc=cd.q.filter((q,k)=>q.o[cd.ans[k]]==q.a).length,adm=user&&user.role=="admin";
 app.innerHTML=`<div class="flag"></div><div class="res"><div class="big">&#127881;</div><h2 class="t">Thank you, ${ESC(cd.n.split(" ")[0])}!</h2>
 <p class="sub">Your answers have been submitted. We will review them and get back to you by email soon.</p></div>
 ${adm?`<div class="rv"><b>Result (visible to admins only)</b><span>${sc} / ${cd.q.length}</span><small>${ESC(cd.n)}, ${ESC(cd.m)}, ${ESC(cd.r)}</small></div>`+cd.q.map((q,k)=>{const ok=q.o[cd.ans[k]]==q.a;return `<div class="rv"><b>${ok?"Correct":"Wrong"}: ${q.q}</b><span>${q.a}</span>${ok?"":`<small>Their answer: ${q.o[cd.ans[k]]}</small>`}</div>`}).join(""):""}`;
 scrollTo(0,0);
}
function start(){
 const raw=cat=="all"?PROF[prof].t.flatMap(t=>pk(gen(t),3)):gen(cat);
 qs=sh(raw).map(q=>({...q,o:sh([q.a,...q.w].filter(Boolean))})).filter(q=>q.o.length>1&&new Set(q.o).size==q.o.length&&q.o.includes(q.a)).slice(0,10);
 if(!qs.length){alert("No questions for this topic yet. Add some in Admin.");return}
 i=score=streak=0;miss=[];show()}

/* ---------- Admin: edits are stored in this browser; export data.json to publish ---------- */
const TABS={q:"Questions",d:"Dishes",f:"Floor",m:"Mise en place",flow:"Service flow",dict:"Dictionary",off:"Offers",x:"Data"};
let tab="q",ed={q:"pizza",m:"foh"};
const ESC=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"),cl=l=>l.split(/\t|\|/).map(x=>x.trim());
const opt=(o,cur)=>o.map(([k,v])=>`<option value="${k}"${k==cur?" selected":""}>${v}</option>`).join("");
const ED={
 q:{sel:()=>opt(Object.entries(CATS).filter(([k])=>k!="all"),ed.q),hint:"One question per line: question | correct answer | wrong 1 | wrong 2 | wrong 3 | explanation. Rows pasted from Google Sheets also work (Auto rows are skipped).",
  get:()=>H.filter(h=>h[0]==ed.q).map(h=>[h[1],h[2],...h[3].split("|").concat(["","",""]).slice(0,3),h[4]].join(" | ")),
  set:L=>{const r=[];L.forEach(l=>{let c=cl(l);if(c[1]=="Auto")return;if(c.length>=8)c=c.slice(2);if(c.length>2)r.push([ed.q,c[0],c[1],c.slice(2,5).filter(Boolean).join("|"),c[5]||""])});H=H.filter(h=>h[0]!=ed.q).concat(r);return r.length+" questions saved."}},
 d:{hint:"One dish per line: name | section (Pizza, Pasta & Risotto, Starters, Mains & Sides, Desserts, Cocktails, Spritzes) | price (0 if none) | ingredient; ingredient; ...",
  get:()=>D.map(d=>[d.n,SEC[d.c],d.p,d.i.join("; ")].join(" | ")),
  set:L=>{const o=[],bad=[];L.forEach(l=>{const c=cl(l),k=Object.keys(SEC).find(k=>k==(c[1]||"").toLowerCase()||SEC[k].toLowerCase()==(c[1]||"").toLowerCase());if(c[0]&&k&&c[3])o.push({n:c[0],c:k,p:+c[2]||0,i:c[3].split(";").map(x=>x.trim()).filter(Boolean)});else bad.push(l.slice(0,28))});D=o;return o.length+" dishes saved."+(bad.length?" Skipped: "+bad.join(" / "):"")}},
 f:{hint:"One section per line: section | table:people, table:people, ... A table can be in two sections.",
  get:()=>Object.entries(FL).map(([c,t])=>c+" | "+t.map(x=>x.join(":")).join(", ")),
  set:L=>{const o={};L.forEach(l=>{const c=l.split("|"),t=(c[1]||"").split(",").map(x=>x.trim().split(":").map(Number)).filter(q=>q[0]&&q[1]);if(c[0].trim()&&t.length)o[c[0].trim()]=t});FL=o;return Object.keys(o).length+" sections saved."}},
 m:{sel:()=>opt(Object.entries(PROF).map(([k,v])=>[k,v.n]),ed.m),hint:"Start each area with # (for example # Opening), then one task per line.",
  get:()=>Object.entries(MISE[ed.m]||{}).flatMap(([g,t])=>["# "+g,...t]),
  set:L=>{const o={};let g="General";L.forEach(l=>{if(l[0]=="#"){g=l.slice(1).trim()||g;o[g]=o[g]||[]}else(o[g]=o[g]||[]).push(l)});MISE[ed.m]=o;return Object.values(o).flat().length+" tasks saved."}},
 flow:{hint:"One step per line, in order.",get:()=>FLOW,set:L=>{FLOW=L;return L.length+" steps saved."}},
 dict:{hint:"term | definition",get:()=>T.map(x=>x.join(" | ")),set:L=>{T=L.map(cl).filter(c=>c[1]).map(c=>[c[0],c[1]]);return T.length+" terms saved."}},
 off:{hint:"dish | what to offer (Pepper, Parmigiano, Chilli oil, Nothing to offer...)",get:()=>O.map(x=>x.join(" | ")),set:L=>{O=L.map(cl).filter(c=>c[1]).map(c=>[c[0],c[1]]);return O.length+" rules saved."}}
};
let dd=null,dc=false,df={q:"",s:""};
const dk=()=>Math.random().toString(36).slice(2),ESQ=t=>ESC(t).replace(/"/g,"&quot;");
function dmsg(t,bad){const m=$("#dmsg");if(m){m.textContent=t||"";m.className="sub"+(bad?" err":"")}}
function dirty(v=true){dc=v;dmsg(v?"You have unsaved changes.":"")}
function dishes(){
 if(!dd)dd=D.map(d=>({...d,k:dk(),i:d.i.join("; ")}));
 app.innerHTML=`<p class="sub">Edit the menu here. Separate ingredients with semicolons, then click Save changes.</p>
 <div class="tb"><input id="dq" placeholder="Search dishes or ingredients" value="${ESQ(df.q)}"><select id="ds"><option value="">All sections</option>${opt(Object.entries(SEC),df.s)}</select><button class="go sm2" data-d="add">+ Add dish</button><button class="go sm2 ok" data-d="save">Save changes</button></div>
 <p class="sub" id="dmsg"></p><div class="tw"><table class="dt"><thead><tr><th>Dish</th><th>Section</th><th>Price</th><th>Ingredients</th><th></th></tr></thead><tbody id="dbody"></tbody></table></div><p class="mu" id="dcount"></p>`;
 drows();dc&&dirty();
}
function drows(){
 const q=df.q.toLowerCase(),r=dd.filter(x=>(!df.s||x.c==df.s)&&(!q||(x.n+" "+x.i).toLowerCase().includes(q)));
 $("#dbody").innerHTML=r.map(x=>`<tr data-k="${x.k}"><td><input data-f="n" value="${ESQ(x.n)}" aria-label="Dish name"></td><td><select data-f="c">${opt(Object.entries(SEC),x.c)}</select></td><td><input data-f="p" type="number" min="0" value="${+x.p||0}" aria-label="Price"></td><td><textarea data-f="i" rows="2" aria-label="Ingredients">${ESC(x.i)}</textarea></td><td><button class="ib" data-d="dup" title="Duplicate" aria-label="Duplicate">${ic("copy")}</button><button class="ib" data-d="del" title="Delete" aria-label="Delete">${ic("trash")}</button></td></tr>`).join("")||`<tr><td colspan="5" class="mu">No dishes match.</td></tr>`;
 $("#dcount").textContent=`${r.length} of ${dd.length} dishes`;
}
function dact(b){
 const a=b.dataset.d,tr=b.closest("tr"),i=tr?dd.findIndex(x=>x.k==tr.dataset.k):-1;
 if(a=="add"){df.q="";$("#dq").value="";dd.unshift({k:dk(),n:"",c:df.s||"pizza",p:0,i:""});drows();dirty();const f=$("#dbody input");f&&f.focus()}
 else if(a=="dup"&&i>=0){dd.splice(i+1,0,{...dd[i],k:dk(),n:dd[i].n+" (copy)"});drows();dirty()}
 else if(a=="del"&&i>=0){if(!confirm("Remove "+(dd[i].n||"this dish")+"?"))return;dd.splice(i,1);drows();dirty()}
 else if(a=="save"){
  const seen={},bad=dd.find(x=>{const n=x.n.trim().toLowerCase();if(!n||!x.i.split(";").some(t=>t.trim())||seen[n])return true;seen[n]=1});
  if(bad){df={q:"",s:""};dishes();const r=document.querySelector(`tr[data-k="${bad.k}"]`);if(r){r.classList.add("bad");r.scrollIntoView({block:"center"})}dmsg("Each dish needs a unique name and at least one ingredient. Check the highlighted row.",1);return}
  D=dd.map(x=>({n:x.n.trim(),c:x.c,p:+x.p||0,i:x.i.split(";").map(t=>t.trim()).filter(Boolean)}));save();dirty(false);dmsg("Saved "+D.length+" dishes.");
 }
}
root.oninput=e=>{const t=e.target,tr=t.closest&&t.closest("tr[data-k]");
 if(tr&&t.dataset.f&&dd){const x=dd.find(y=>y.k==tr.dataset.k);if(x){x[t.dataset.f]=t.value;dirty()}}
 else if(t.id=="dq"){df.q=t.value;drows()}};
function admin(){
 if(!user||user.role!="admin")return;
 if(tab=="d")return dishes();
 const e=ED[tab];
 app.innerHTML=`
 <p class="sub">Edits are saved in this browser only. Use the Data tab to export and publish them.</p>
 
 ${tab=="x"?`<p class="sub">${D.length} dishes, ${H.length} written questions, ${Object.keys(FL).length} sections. ${store.get("g250db")?"This browser has local edits.":"No local edits."}</p>
 <button class="go" data-a="exp">Export data.json</button><label class="ghost" style="text-align:center">Import data.json<input id="imp" type="file" accept=".json" hidden></label><button class="ghost" data-a="disc">Discard local edits</button>
 <p class="soon">Candidate test link: your site URL followed by <a href="#/test" style="color:#f2c14e">#/test</a></p><p class="soon">To publish: put the exported data.json next to build.js and run the build. It is embedded in dist/index.html.</p>`
 :`${e.sel?`<select id="sel">${e.sel()}</select>`:""}<p class="sub">${e.hint}</p><textarea id="ta" spellcheck="false">${ESC(e.get().join("\n"))}</textarea><button class="go" data-a="save">Save</button><p id="msg" class="sub"></p>`}`;
}
function adm(b){const a=b.dataset.a;
 if(a.startsWith("t:")){tab=a.slice(2);admin()}
 else if(a=="save"){const m=ED[tab].set($("#ta").value.split("\n").map(x=>x.trim()).filter(Boolean));save();$("#msg").textContent=m}
 else if(a=="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(getDB(),null,1)],{type:"application/json"}));l.download="data.json";l.click()}
 else if(a=="disc"){store.set("g250db","");setDB(JSON.parse(PUB?JSON.stringify(PUB):SEED));admin()}
}
root.onchange=e=>{
 if(e.target.id=="sel"){tick();ed[tab]=e.target.value;admin()}
 if(e.target.id=="ds"){df.s=e.target.value;drows()}
 if(e.target.id=="imp"){const f=e.target.files[0];f&&f.text().then(t=>{try{setDB(JSON.parse(t));save();admin()}catch(x){alert("That file is not valid.")}})}
};
function show(){
 const q=qs[i];
 app.innerHTML=`<div class="top"><button class="x" id="home" aria-label="Quit quiz">&#10005;</button><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><b>${i+1}/${qs.length}</b></div>
 <div class="meta">Score ${score}${streak>1?` - ${streak} in a row!`:""}</div>
 <h3 class="q">${q.q}</h3>
 <div>${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span>${"ABCD"[k]}</span>${o}</button>`).join("")}</div><div id="fb"></div>`;
}
function ans(k){
 const q=qs[i];if(q.done)return;q.done=1;
 const ok=q.o[k]==q.a;beep(ok);
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]==q.a)b.classList.add("ok");else if(j==k)b.classList.add("bad")});
 if(ok){score++;streak++}else{streak=0;miss.push(q)}
 $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?R(["Perfetto!","Bravo!","Esatto!","Delizioso!"]):"Not quite."}</b><p>${ok?"":`The answer is ${q.a}. `}${q.e}</p></div><button class="go" id="nx">${i+1<qs.length?"Next question":"See results"}</button>`;
 $("#nx").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function end(){
 const p=score/qs.length,key="b_"+prof+cat,b=+store.get(key)||0;if(score>b)store.set(key,score);
 app.innerHTML=`<div class="res"><div class="big">${p==1?"&#127942;":p>=.7?"&#127837;":p>=.4?"&#127829;":"&#128214;"}</div><h2 class="t">${score} / ${qs.length}</h2>
 <p class="sub">${p==1?"Perfetto! You know this one cold.":p>=.7?"Great round. Almost there.":p>=.4?"Good start. Review and go again.":"Keep studying. It gets easier."}${score>b&&b?" New personal best!":""}</p>
 ${miss.length?`<h3 class="t">Review</h3>`+miss.map(q=>`<div class="rv"><b>${q.q}</b><span>${q.a}</span><small>${q.e}</small></div>`).join(""):""}
 <button class="go" id="go">Play again</button><button class="ghost" id="home">Back to topics</button></div>`;
 scrollTo(0,0);
}
root.onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id=="go")start();else if(b.id=="guide")guide();else if(b.id=="main")main();else if(b.id=="admin")admin();else if(b.id=="login")login();else if(b.id=="logout"){b.disabled=true;b.querySelector("span").textContent="Signing out...";setTimeout(()=>{user=null;login()},800)}else if(b.id=="dologin")doLogin();else if(b.dataset.n)go(b.dataset.n);else if(b.id=="tg")tgl();else if(b.id=="sbk")$("#shell").classList.remove("open");else if(b.id=="cstart")cstart();else if(b.id=="cnext")cnext();else if(b.dataset.ck!=null)csel(+b.dataset.ck);else if(b.dataset.p){prof=b.dataset.p;cat="all";home()}else if(b.dataset.a)adm(b);else if(b.dataset.d)dact(b);else if(b.id=="snd"){snd=!snd;store.set("snd",snd?"on":"off");beep(1);b.querySelector("span").textContent="Sound: "+(snd?"on":"off")}else if(b.id=="home")home();else if(b.id=="nx"){i++;i<qs.length?show():end()}
 else if(b.dataset.c){cat=b.dataset.c;home()}else if(b.dataset.k)ans(+b.dataset.k);else if(b.classList.contains("opt"))ans(0)};
document.onkeydown=e=>{
 if(e.key=="Enter"&&$("#dologin")){e.preventDefault();if(!$("#dologin").disabled)doLogin()}
 else if(e.key=="Enter"&&$("#nx")){e.preventDefault();$("#nx").click()}
 else if("1234".includes(e.key)&&e.key){const o=document.querySelectorAll(".opt")[+e.key-1];if(o&&!o.disabled)o.click()}
};
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button");if(b&&!b.disabled&&(!b.classList.contains("opt")||b.dataset.ck!=null))tick()},true);
init();
</script>
</body>
</html>
