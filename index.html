 const R=stats.filter(x=>x.u==u).sort((a,b)=>b.d-a.d),S=summ(R),a=USERS[u]||{n:u},bt={},ms={};
 R.forEach(x=>{const k=CATS[x.c]||x.c;bt[k]=bt[k]||{s:0,t:0,n:0};bt[k].s+=x.s;bt[k].t+=x.t;bt[k].n++;(x.m||[]).forEach(q=>ms[q]=(ms[q]||0)+1)});
 const top=Object.entries(ms).sort((p,q)=>q[1]-p[1]).slice(0,5);
 app.innerHTML=`<div class="top">${user.role=="admin"?`<button class="x" data-r="" aria-label="Back to users">&#8592;</button>`:""}<h2 class="t" style="margin:0">${ESC(a.n)}</h2></div>
 <div class="kp"><div><b>${S.r}</b><span>Rounds played</span></div><div><b>${S.p}%</b><span>Average score</span></div><div><b>${S.best}%</b><span>Best round</span></div><div><b>${S.t}</b><span>Questions answered</span></div></div>`+
 (S.r?`<h3 class="t">By topic</h3><div class="tw"><table class="dt gt"><thead><tr><th>Topic</th><th>Rounds</th><th>Accuracy</th></tr></thead><tbody>${Object.entries(bt).sort((x,y)=>pct(x[1].s,x[1].t)-pct(y[1].s,y[1].t)).map(([k,v])=>`<tr><td>${ESC(k)}</td><td>${v.n}</td><td>${pct(v.s,v.t)}% ${pbar(pct(v.s,v.t))}</td></tr>`).join("")}</tbody></table></div>
 <h3 class="t">Most missed questions</h3>${top.length?`<div class="tw"><table class="dt gt"><tbody>${top.map(([q,n])=>`<tr><td>${ESC(q)}</td><td style="width:90px">${n} time${n>1?"s":""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="sub">No missed questions. Great work!</p>`}
 <h3 class="t">Recent rounds</h3><div class="tw"><table class="dt gt"><thead><tr><th>Date</th><th>Team</th><th>Topic</th><th>Score</th></tr></thead><tbody>${R.slice(0,15).map(x=>`<tr><td>${fd(x.d)}</td><td>${(PROF[x.p]||{}).n||x.p}</td><td>${ESC(CATS[x.c]||x.c)}</td><td>${x.s}/${x.t} (${pct(x.s,x.t)}%)</td></tr>`).join("")}</tbody></table></div>`:`<p class="sub">No rounds yet. Play a trivia round to see stats here.</p>`);
}
function admin(){
 if(!user||user.role!="admin")return;
 if(tab=="d")return dishes();
 if(tab=="cand")return cands();
 if(tab=="tpl")return tpl();
 if(tab=="q")return questions();
 if(TC[tab])return table(tab);
 const e=ED[tab];
 app.innerHTML=`
 <p class="sub">Edits are saved in this browser only. Use the Data tab to export and publish them.</p>
 
 ${tab=="x"?`<p class="sub">${D.length} dishes, ${H.length} written questions, ${Object.keys(FL).length} sections. ${store.get("g250db")?"This browser has local edits.":"No local edits."}</p>
 <button class="go" data-a="exp">Export data.json</button><label class="ghost" style="text-align:center">Import data.json<input id="imp" type="file" accept=".json" hidden></label><button class="ghost" data-a="disc">Discard local edits</button>
 <p class="soon">Candidate test link: your site URL followed by <a href="#/test" style="color:#f2c14e">#/test</a></p><p class="soon">To publish: put the exported data.json next to build.js and run the build. It is embedded in dist/index.html.</p>`
 :`${e.sel?`<select id="sel">${e.sel()}</select>`:""}<p class="sub">${e.hint}</p><textarea id="ta" spellcheck="false">${ESC(e.get().join("\n"))}</textarea><button class="go" data-a="save">Save</button><p id="msg" class="sub"></p>`}`;
}
function adm(b){const a=b.dataset.a;
 if(a.startsWith("t:")){tab=a.slice(2);admin()}
 else if(a=="save"){const m=ED[tab].set($("#ta").value.split("\n").map(x=>x.trim()).filter(Boolean));save();$("#msg").textContent=m}
 else if(a=="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(getDB(),null,1)],{type:"application/json"}));l.download="data.json";l.click()}
 else if(a=="disc"){store.set("g250db","");setDB(JSON.parse(PUB?JSON.stringify(PUB):SEED));admin()}
}
root.onchange=e=>{
 if(e.target.id=="sel"){tick();ed[tab]=e.target.value;admin()}
 if(e.target.id=="ds"){if(tab=="q"){qf.s=e.target.value;qf.pg=0;qrows()}else{df.s=e.target.value;drows()}}
 if(e.target.id=="tf"){te.s=e.target.value;trows()}
 if(e.target.id=="cp2"){cf.p=e.target.value;clist()}
 if(e.target.dataset.cs){const c=CANDS.find(x=>x.id==e.target.dataset.cs);if(c){c.st=e.target.value;store.set("g250cand",JSON.stringify(CANDS))}}
 if(e.target.id=="tpt"){tf2.s=e.target.value;tbank()}
 if(e.target.id=="tps"){tpS=e.target.checked;tpd=true}
 if(e.target.id=="ts"){if(te.dirty&&!confirm("Discard unsaved changes?")){e.target.value=te.p;return}te.p=e.target.value;te.rows=null;te.dirty=false;table(te.k)}
 if(e.target.id=="imp"){const f=e.target.files[0];f&&f.text().then(t=>{try{setDB(JSON.parse(t));save();admin()}catch(x){alert("That file is not valid.")}})}
};
const TLIM_QUIZ=20,TLIM_TEST=20;let TI=null;const timed=()=>store.get("g250timed")=="1";
function tmStop(){clearInterval(TI);TI=null;const b=document.getElementById("tm");if(b){b.style.width=getComputedStyle(b).width;b.style.transition="none"}}
function tmStart(onEnd,sec){tmStop();const bar=document.getElementById("tm"),rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
 if(bar){bar.style.transition="none";bar.style.width="100%";void bar.offsetWidth;if(!rm){bar.style.transition=`width ${sec}s linear`;bar.style.width="0%"}}
 const t0=Date.now();TI=setInterval(()=>{const b=document.getElementById("tm");if(!b){tmStop();return}
  const left=Math.max(0,sec*1000-(Date.now()-t0));if(rm)b.style.width=left/sec/10+"%";b.parentNode.classList.toggle("low",left<=3000);document.getElementById("tn").textContent=Math.ceil(left/1000);
  if(left<=0){clearInterval(TI);TI=null;onEnd()}},100)}
const tmHtml=sec=>`<div class="tmw"><div class="tmr"><i id="tm" style="width:100%"></i></div><span id="tn">${sec}</span></div>`;
function show(){
 const q=qs[i];
 app.innerHTML=`<div class="top"><button class="x" id="home" aria-label="Quit quiz">&#10005;</button><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><b>${i+1}/${qs.length}</b></div>
 <div class="meta">Score ${score}${streak>1?` - ${streak} in a row!`:""}</div>${timed()?tmHtml(TLIM_QUIZ):""}
 <h3 class="q">${q.q}</h3>
 <div>${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span>${k+1}</span>${o}</button>`).join("")}</div><div id="fb"></div>`;
 if(timed())tmStart(()=>ans(-1),TLIM_QUIZ);else tmStop();
}
function ans(k){
 const q=qs[i];if(q.done)return;q.done=1;tmStop();
 const ok=q.o[k]==q.a;beep(ok);
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]==q.a)b.classList.add("ok");else if(j==k)b.classList.add("bad")});
 if(ok){score++;streak++}else{streak=0;miss.push(q)}
 $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?R(["Perfetto!","Bravo!","Esatto!","Delizioso!"]):k<0?"Time is up!":"Not quite."}</b><p>${ok?"":`The answer is ${q.a}. `}${q.e}</p></div><button class="go" id="nx">${i+1<qs.length?"Next question":"See results"}</button>`;
 $("#nx").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function end(){
 tmStop();
 if(user){stats.push({u:user.u,p:prof,c:cat,s:score,t:qs.length,d:Date.now(),m:miss.slice(0,10).map(q=>q.q)});store.set("g250st",JSON.stringify(stats))}
 const p=score/qs.length,b=Math.max(0,...stats.slice(0,-1).filter(x=>x.u==user.u&&x.p==prof&&x.c==cat).map(x=>x.s));
 app.innerHTML=`<div class="res"><div class="big">${p==1?"&#127942;":p>=.7?"&#127837;":p>=.4?"&#127829;":"&#128214;"}</div><h2 class="t">${score} / ${qs.length}</h2>
 <p class="sub">${p==1?"Perfetto! You know this one cold.":p>=.7?"Great round. Almost there.":p>=.4?"Good start. Review and go again.":"Keep studying. It gets easier."}${score>b&&b?" New personal best!":""}</p>
 ${miss.length?`<h3 class="t">Review</h3>`+miss.map(q=>`<div class="rv"><b>${q.q}</b><span>${q.a}</span><small>${q.e}</small></div>`).join(""):""}
 <button class="go" id="go">Play again</button><button class="ghost" id="home">Back to topics</button></div>`;
 scrollTo(0,0);
}
root.onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id=="go")start();else if(b.id=="tmt"){store.set("g250timed",timed()?"0":"1");home()}else if(b.id=="guide")guide();else if(b.id=="main")main();else if(b.id=="admin")admin();else if(b.id=="login")login();else if(b.id=="logout"){b.disabled=true;b.querySelector("span").textContent="Signing out...";setTimeout(()=>{user=null;login()},800)}else if(b.id=="dologin")doLogin();else if(b.dataset.n)go(b.dataset.n);else if(b.id=="tg")tgl();else if(b.id=="sbk")$("#shell").classList.remove("open");else if(b.id=="cstart")cstart();else if(b.id=="cnext")cnext();else if(b.dataset.ck!=null)csel(+b.dataset.ck);else if(b.dataset.p){prof=b.dataset.p;cat="all";home()}else if(b.dataset.a)adm(b);else if(b.dataset.d)dact(b);else if(b.dataset.qa)qact(b);else if(b.dataset.ta)tact(b);else if(b.dataset.tpa)tpact(b);else if(b.dataset.cv!=null){cf.v=b.dataset.cv||null;cands()}else if(b.dataset.cx){if(confirm("Delete this candidate?")){CANDS=CANDS.filter(x=>x.id!=b.dataset.cx);store.set("g250cand",JSON.stringify(CANDS));cands()}}else if(b.dataset.r!=null){rp.u=b.dataset.r;reports()}else if(b.id=="snd"){snd=!snd;store.set("snd",snd?"on":"off");beep(1);b.querySelector("span").textContent="Sound: "+(snd?"on":"off")}else if(b.id=="home")home();else if(b.id=="nx"){i++;i<qs.length?show():end()}
 else if(b.dataset.c){cat=b.dataset.c;home()}else if(b.dataset.k)ans(+b.dataset.k);else if(b.classList.contains("opt"))ans(0)};
document.onkeydown=e=>{
 if(e.key=="Enter"&&e.target.dataset&&e.target.dataset.ing!=null){e.preventDefault();const bb=e.target.closest("tr").querySelector('[data-d="iadd"]');bb&&bb.click()}
 else if(e.key=="Enter"&&$("#dologin")){e.preventDefault();if(!$("#dologin").disabled)doLogin()}
 else if(e.key=="Enter"&&$("#nx")){e.preventDefault();$("#nx").click()}
 else if(e.key=="Enter"&&$("#cnext")){e.preventDefault();if(!$("#cnext").disabled)$("#cnext").click()}
 else if("1234".includes(e.key)&&e.key){const o=document.querySelectorAll(".opt")[+e.key-1];if(o&&!o.disabled)o.click()}
};
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button");if(b&&!b.disabled&&(!b.classList.contains("opt")||b.dataset.ck!=null))tick()},true);
init();
